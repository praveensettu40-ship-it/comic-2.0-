<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComicCraft - Create Your Comic</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      /* Optional: drop your own picture at static/background.jpg. The gradient is the fallback. */
      background:
        url('/static/background.jpg') center / cover no-repeat fixed,
        linear-gradient(160deg, #3f7f99 0%, #8fc3d1 45%, #f2c9a8 100%);
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 12px;
      padding: 28px 24px 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    }
    h1 { margin: 0 0 18px; text-align: center; font-size: 28px; color: #222; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; font-size: 14px; }
    textarea, input, select {
      width: 100%;
      padding: 9px 10px;
      font-size: 14px;
      border: 1px solid #c8c8c8;
      border-radius: 6px;
      background: #fff;
    }
    textarea { min-height: 70px; resize: vertical; font-family: Consolas, monospace; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      font-size: 16px;
      color: #fff;
      background: #0066cc;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #004f9e; }
    button:disabled { background: #7a9cc2; cursor: wait; }
    .error {
      background: #fdecea;
      color: #a12622;
      border: 1px solid #f5c2be;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 14px;
      margin-bottom: 8px;
      word-break: break-word;
    }
    #loading { display: none; margin-top: 14px; text-align: center; font-size: 14px; color: #333; }
    .spinner {
      width: 26px; height: 26px; margin: 0 auto 8px;
      border: 4px solid #cfd8e3; border-top-color: #0066cc;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>&#9999;&#65039; Create Your Comic</h1>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form id="comic-form" action="/generate" method="post">
      <label for="prompt">Story Prompt:</label>
      <textarea id="prompt" name="prompt" required maxlength="1000"
                placeholder="A brave fox explores an enchanted forest.">{{ form.prompt }}</textarea>

      <label for="character_name">Main Character Name:</label>
      <input id="character_name" type="text" name="character_name" required maxlength="60"
             value="{{ form.character_name }}">

      <label for="setting">Setting:</label>
      <select id="setting" name="setting">
        {% for option in settings %}
        <option value="{{ option }}" {% if option == form.setting %}selected{% endif %}>{{ option }}</option>
        {% endfor %}
      </select>

      <label for="tone">Story Tone:</label>
      <select id="tone" name="tone">
        {% for option in tones %}
        <option value="{{ option }}" {% if option == form.tone %}selected{% endif %}>{{ option }}</option>
        {% endfor %}
      </select>

      <label for="style">Art Style:</label>
      <select id="style" name="style">
        {% for option in styles %}
        <option value="{{ option }}" {% if option == form.style %}selected{% endif %}>{{ option }}</option>
        {% endfor %}
      </select>

      <button id="submit-btn" type="submit">Generate Comic</button>
      <div id="loading">
        <div class="spinner"></div>
        Creating your comic... this can take a few minutes. Please keep this tab open.
      </div>
    </form>
  </div>

  <script>
    document.getElementById("comic-form").addEventListener("submit", function () {
      var button = document.getElementById("submit-btn");
      button.disabled = true;
      button.textContent = "Generating...";
      document.getElementById("loading").style.display = "block";
    });
    // Reset the button if the user comes back with the browser Back button.
    window.addEventListener("pageshow", function () {
      var button = document.getElementById("submit-btn");
      button.disabled = false;
      button.textContent = "Generate Comic";
      document.getElementById("loading").style.display = "none";
    });
  </script>
</body>
</html>
